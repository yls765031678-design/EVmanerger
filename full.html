*{box-sizing:border-box}

/* ---------- header ---------- */
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px 0}

.sub{color:var(--txt2);font-size:12px}

#qclear:hover{color:var(--txt)}

nav{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{

}

main{padding:18px 26px 60px;max-width:100%}

.kpi.bad .vl{color:var(--red)}

.b.high{background:var(--orange-bg);color:var(--orange)}

.b.warn{background:var(--amber-bg);color:var(--amber)}
.sr-ok{color:var(--green);font-weight:600}
.sr-md{color:var(--amber);font-weight:600}
.sr-bad{color:var(--red);font-weight:600}
.zero{color:var(--txt3)}

.fbar .fl{font-size:11.5px;color:var(--txt3);margin-right:2px}

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => (v === null || v === undefined || v === '') ? '—' : Number(v).toLocaleString('zh-CN');
const isNum = v => typeof v === 'number' && isFinite(v);
let Q = '';

function srClass(v){ if(!isNum(v)) return 'zero'; return v>=88?'sr-ok':(v>=70?'sr-md':'sr-bad'); }
function srCell(v){ return isNum(v) ? `<span class="${srClass(v)}">${v.toFixed(1)}%</span>` : '<span class="zero">—</span>'; }
/* 失败率：越低越好，颜色方向与成功率相反 */
function frCell(v, total){
  if(!isNum(v) || !total) return '<span class="zero">—</span>';
  const c = v <= 5 ? 'sr-ok' : (v <= 20 ? 'sr-md' : 'sr-bad');
  return `<span class="${c}">${v.toFixed(1)}%</span>`;
}
function gradeTag(g){
  const lb = GL[g] || (g === 'none' ? '无订单' : g);
  return `<span class="b ${g}">${esc(lb)}</span>`;
}
function statusTag(s){
  const m = {'在线运行':'op','离线停运':'fault','试充':'mid','退役':'mute',
             '待绑定·未上电':'warn','未绑定·未上电':'warn','未上电':'mute','未分类':'mute'};
  return `<span class="b ${m[s]||'mute'}">${esc(s)}</span>`;
}
function flagTags(fl){
  if(!fl || !fl.length) return '<span class="zero">—</span>';
  const map = {'STOP':['fault','停摆'],'HP':['hp','高功率'],'INT':['blue','间歇'],'SEG':['mute','故障段'],'TRIAL':['blue','试充']};
  return fl.map(f => {
    if(f.indexOf('FUSE:') === 0) return `<span class="b warn">丝${esc(f.slice(5))}</span>`;
    const m = map[f] || ['mute', f];
    return `<span class="b ${m[0]}">${esc(m[1])}</span>`;
  }).join(' ');
}
/* row text cache for global search */
const TEXTCACHE = new WeakMap();
function rowText(r){
  let t = TEXTCACHE.get(r);
  if(t) return t;
  const parts = [];
  for(const k in r){ const v = r[k]; if(v === null || v === undefined || typeof v === 'object') continue; parts.push(v); }
  t = parts.join(' ').toLowerCase();
  TEXTCACHE.set(r, t);
  return t;
}

/* ================= table engine ================= */
function rowsOf(cfg){
  let rs = cfg.rows;
  const f = cfg.filters && cfg.filters.length ? (cfg.filters.find(x => x.key === cfg._f) || cfg.filters[0]) : null;
  if(f && f.test) rs = rs.filter(f.test);
  if(Q) rs = rs.filter(r => rowText(r).indexOf(Q) >= 0);
  const sk = cfg._sort ? cfg._sort.k : null;
  if(sk){
    const col = cfg.cols.find(c => c.k === sk);
    const dir = cfg._sort.d === 'desc' ? -1 : 1;
    const numeric = col && (col.type === 'n' || col.type === 'pct' || col.type === 'money');
    rs = rs.slice().sort((a,b) => {
      let x = a[sk], y = b[sk];
      if(numeric){ x = isNum(x) ? x : -Infinity; y = isNum(y) ? y : -Infinity; return (x - y) * dir; }
      x = (x === null || x === undefined) ? '' : String(x); y = (y === null || y === undefined) ? '' : String(y);
      return x.localeCompare(y, 'zh-CN') * dir;
    });
  }
  return rs;
}

function cellHTML(col, r){
  if(col.render) return col.render(r);
  const v = r[col.k];
  if(col.type === 'n') return isNum(v) ? num(v) : (v === 0 ? '0' : '<span class="zero">—</span>');
  if(col.type === 'pct') return srCell(v);
  if(col.type === 'money') return isNum(v) ? '¥' + Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
  if(v === null || v === undefined || v === '') return '<span class="zero">—</span>';
  return esc(v);
}

function buildTable(cfg){
  const card = document.createElement('div');
  card.className = 'card';
  if(!cfg._f && cfg.filters && cfg.filters.length) cfg._f = cfg.filters[0].key;
  if(!cfg._sort && cfg.defaultSort) cfg._sort = {k: cfg.defaultSort, d: cfg.defaultDir || 'desc'};
  if(!cfg._limit) cfg._limit = cfg.pageSize || 100000;

  const head = document.createElement('div');
  head.innerHTML = `<h2>${esc(cfg.title || '')}${cfg.note ? '' : ''}<span class="n" data-cnt></span></h2>` +
                   (cfg.note ? `<p class="note">${cfg.note}</p>` : '');
  card.appendChild(head);

  if(cfg.filters && cfg.filters.length){
    const fb = document.createElement('div');
    fb.className = 'fbar';
    fb.innerHTML = `<span class="fl">${esc(cfg.filterLabel || '筛选')}</span>`;
    cfg.filters.forEach(f => {
      const b = document.createElement('button');
      b.className = 'fbtn' + (f.key === cfg._f ? ' on' : '');
      b.textContent = f.label;
      b.onclick = () => { cfg._f = f.key; cfg._limit = cfg.pageSize || 100000; refresh(cfg); fb.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
      fb.appendChild(b);
    });
    const fc = document.createElement('span');
    fc.className = 'fcount';
    fb.appendChild(fc);
    card.appendChild(fb);
    cfg._fc = fc;
  }

  const sc = document.createElement('div');
  sc.className = 'tscroll';
  const tbl = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  cfg.cols.forEach(c => {
    const th = document.createElement('th');
    th.className = (c.type === 'n' || c.type === 'pct' || c.type === 'money') ? 'n' : '';
    th.innerHTML = esc(c.label) + (cfg._sort && cfg._sort.k === c.k ? `<span class="ar">${cfg._sort.d === 'desc' ? '▼' : '▲'}</span>` : '');
    th.onclick = () => {
      cfg._sort = (cfg._sort && cfg._sort.k === c.k) ? {k:c.k, d: cfg._sort.d==='desc'?'asc':'desc'} : {k:c.k, d:'desc'};
      refresh(cfg);
    };
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  tbl.appendChild(tbody);
  sc.appendChild(tbl);
  card.appendChild(sc);

  const more = document.createElement('button');
  more.className = 'more';
  more.style.display = 'none';
  more.onclick = () => { cfg._limit += (cfg.pageSize || 500); refresh(cfg); };
  card.appendChild(more);

  cfg._tbody = tbody; cfg._more = more; cfg._head = head.querySelector('[data-cnt]');
  refresh(cfg);
  return card;
}

function refresh(cfg){
  const rs = rowsOf(cfg);
  const shown = rs.slice(0, cfg._limit);
  const out = [];
  for(let i = 0; i < shown.length; i++){
    const r = shown[i];
    out.push('<tr>' + cfg.cols.map(c => {
      const cls = (c.type === 'n' || c.type === 'pct' || c.type === 'money') ? ' class="n"' : (c.cls ? ` class="${c.cls}"` : '');
      return `<td${cls}>${cellHTML(c, r)}</td>`;
    }).join('') + '</tr>');
  }
  cfg._tbody.innerHTML = out.length ? out.join('') :
    `<tr><td colspan="${cfg.cols.length}"><div class="empty">无匹配记录</div></td></tr>`;
  const total = cfg.rows.length;
  const hit = rs.length;
  if(cfg._head) cfg._head.textContent = (hit === total) ? `共 ${num(total)} 行` : `命中 ${num(hit)} / 共 ${num(total)} 行`;
  if(cfg._fc) cfg._fc.textContent = (hit === total) ? `共 ${num(total)} 行` : `筛选后 ${num(hit)} 行 / 全量 ${num(total)} 行`;
  if(cfg._more){
    const rest = hit - shown.length;
    cfg._more.style.display = rest > 0 ? 'block' : 'none';
    cfg._more.textContent = `继续加载（剩余 ${num(rest)} 行，已显示 ${num(shown.length)}）`;
  }
}

/* ================= views ================= */
function typeText(t){
  if(t === null || t === undefined) return '<span class="zero">无记录</span>';
  const s = String(t).trim();
  if(!s || s === 'None') return '<span class="zero">无记录</span>';
  const hasFail = s.indexOf('充电失败') >= 0, hasStop = s.indexOf('用户主动停止') >= 0,
        hasFull = s.indexOf('电量充满') >= 0, hasPow = s.indexOf('功率超标') >= 0;
  const out = [];
  if(hasFail) out.push('<span class="b fault">充电失败</span>');
  if(hasPow) out.push('<span class="b high">功率超标</span>');
  if(hasFull) out.push('<span class="b op">充满</span>');
  if(hasStop) out.push('<span class="b mute">主动停止</span>');
  return out.length ? out.join(' ') : esc(s);
}
function kpi(label, value, extra, cls){
  return `<div class="kpi ${cls||''}"><div class="lb">${label}</div><div class="vl">${value}</div>${extra?`<div class="ex">${extra}</div>`:''}</div>`;
}

  const bad = (gc.high || 0) + (gc.fault || 0);
  return `<div class="kpis">
  ${kpi('物理端口', num(PORTS.length), '448 台 × 10 口', '')}
  ${kpi('有订单端口', num(used.length), '占 ' + (used.length / PORTS.length * 100).toFixed(1) + '%', 'good')}
  ${kpi('无订单端口', num(gc.none || 0), '从未被使用', 'mute')}
  ${kpi('正常', num(gc.op || 0), '占活跃口 ' + (gc.op / gsum * 100).toFixed(1) + '%', 'good')}
  ${kpi('可疑', num(gc.mid || 0), '失败率偏高', 'warn')}
  ${kpi('高度可疑', num(gc.high || 0), '近乎不可用', 'warn')}
  ${kpi('确定故障', num(gc.fault || 0), '全历史 0 成功', 'bad')}
  ${kpi('坏口合计', num(bad), '占活跃口 ' + (bad / gsum * 100).toFixed(1) + '%', 'bad')}
  </div>`;
}

/* ================= assemble ================= */
const VIEWS = [
  {id:'ov',    label:'① 全局概览',  cfgs: overviewCfgs, kpis: true},
  {id:'st',    label:'② 站点台账',  cfgs: stationCfgs},
  {id:'dev',   label:'③ 设备总表',  cfgs: deviceCfgs, cards: devCards},
  {id:'port',  label:'④ 端口总表',  cfgs: portCfgs, cards: portCards},
  {id:'fuse',  label:'⑤ 保险丝反推', cfgs: fuseCfgs, cards: fuseCards},
  {id:'hp',    label:'⑥ 高功率',    cfgs: hpCfgs, cards: hpCards},
  {id:'inter', label:'⑦ 间歇·破坏', cfgs: interCfgs, cards: interCards},
  {id:'churn', label:'⑧ 流失尾部',  cfgs: churnCfgs, cards: churnCards},
];

function kvCards(list){
  return `<div class="kpis">${list.map(x => kpi(x[0], x[1], x[2], x[3])).join('')}</div>`;
}
function fuseCards(){
  const s = D.fuse.summary;
  return `<div class="card"><h2>A/B/C 三档口径与覆盖率</h2>
  <p class="note">甲方向我方主张"已更换 200 个保险丝"，本区块用订单行为反推该主张的可验证边界 —— 只统计<b>有订单行为证据</b>的端口，不被维修工单口径污染。</p>
  ${kvCards([
    ['甲方主张更换', num(s.claimed) + ' 个', '端口级诉求', 'warn'],
    ['可验证命中端口', num(s.hit_ports) + ' 个', '跨 ' + s.hit_devices + ' 台设备', 'good'],
    ['命中覆盖率', s.coverage + '%', '占 4,480 物理口', ''],
    ['A+B+C 合计', num(s.A_ports + s.B_ports + s.C_ports) + ' 口', `A ${s.A_ports} / B ${s.B_ports} / C ${s.C_ports}`],
    ['故障段总数', num(s.seg_total) + ' 段', '已恢复 ' + s.seg_rec + ' / 未恢复 ' + s.seg_unrec],
    ['缺口', num(s.gap) + ' 段', s.gap_ports + ' 个端口无恢复证据', 'bad'],
    ['有单端口', num(s.ports_with_order), '无单 ' + num(s.ports_no_order)],
    ['从未失败端口', num(s.ports_never_fail), '无故障症状 ' + num(s.ports_no_symptom)],
  ])}
  <div class="legend">
    <span><i style="background:#b3261e"></i>A 档：全历史零成功，强断路信号</span>
    <span><i style="background:#b4530a"></i>B 档：反复故障且已恢复，间歇性接触问题</span>
    <span><i style="background:#5b6775"></i>C 档：故障后整机停用，疑似已拆机</span>
  </div></div>`;
}
function hpCards(){
  const s = D.hp.summary, b = s.bands.gt2000, b2 = s.bands.b1500_2000 || {};
  return `<div class="card"><h2>功率异常全景</h2>
  <p class="note">在 ${num(s.orders_ok)} 笔成功订单中，功率分布 p50 = ${s.ok_p50}W、p99 = ${s.ok_p99}W、最大值 ${s.ok_max}W。&gt;2000W 的 ${b.orders} 单全部为<b>用户取消 + 已退款 + 秒级结束</b>，无一产生真实充电量。</p>
  ${kvCards([
    ['>2000W 订单', num(b.orders) + ' 单', '涉及 ' + b.devices + ' 台设备 / ' + b.users + ' 人', 'bad'],
    ['功率区间', b.pw_min + '~' + b.pw_max + 'W', '均值 ' + b.pw_mean.toFixed(0) + 'W', 'warn'],
    ['离散度 CV', D.hp.dispersion.gt2000_cv, '区间宽度仅 ' + D.hp.dispersion.gt2000_range_pct + '%', ''],
    ['实际充电量', b.kwh_p50 + ' kWh', '中位值（近乎为 0）', ''],
    ['1500~2000W', num(b2.orders || 0) + ' 单', (b2.devices || 0) + ' 台设备 / ' + (b2.users || 0) + ' 人'],
    ['成功订单峰值', s.ok_max + 'W', '正常负载上限参考', 'good'],
  ])}
  <div class="legend"><span>结论：功率值高度集中且无真实电量，倾向<b>设备功率采样/上报异常</b>，非用户侧大功率负载。</span></div></div>`;
}
function interCards(){
  const s = D.inter.summary, ss = D.sab.summary;
  return `<div class="card"><h2>间歇性故障与破坏假设检验</h2>
  <p class="note">${esc(D.inter.criteria.strict)}；${esc(D.inter.criteria.loose)}。</p>
  ${kvCards([
    ['严格档端口', s.strict.ports + ' 口', s.strict.devices + ' 台设备', 'bad'],
    ['严格档失败单', num(s.strict.fail_orders), '恢复 ' + s.strict.recover_total + ' 次', ''],
    ['宽松档端口', s.loose.ports + ' 口', s.loose.devices + ' 台设备', 'warn'],
    ['宽松档失败单', num(s.loose.fail_orders), '仍异常 ' + s.loose.still_bad_30d + ' 口（近30天）'],
    ['故障段总数', num(ss.segments) + ' 段', '含前置用户 ' + ss.segments_with_prev + ' 段'],
    ['前置用户数', num(ss.prev_users) + ' 人', '最大命中 3 次'],
    ['p<0.05 嫌疑', num(ss.suspect_p05) + ' 人', 'p<0.01 仅 ' + ss.suspect_p01 + ' 人', 'warn'],
    ['跨设备聚集', ss.multi_device + ' 人', '零假设期望最大 ' + ss.expected_max_under_null + ' 次', 'good'],
  ])}
  <div class="legend"><span>结论：未见跨设备重复命中，样本量不足以支撑"蓄意破坏"，<b>建议按设备劣化处理</b>。</span></div></div>`;
}
function churnCards(){
  return `<div class="card"><h2>流失尾部定义与规模</h2>
  <p class="note">96 人中末单落在坏口的有 <b>${D.churn.filter(r => r.on_bad_port).length}</b> 人；另有 30 人末次充电电量为 0（零负载）。两组可交叉核对为"设备原因主动流失"的上界。</p>
  ${kvCards([
    ['流失尾部用户', D.churn.length + ' 人', '极低电量 + 无复充', 'warn'],
    ['末单在坏口', D.churn.filter(r => r.on_bad_port).length + ' 人', '可归因设备', 'bad'],
    ['尾部零成功', D.churn.filter(r => !r.tail_ok).length + ' 人', '离场前一次都没成功', 'bad'],
    ['零负载流失', D.churnZero.length + ' 人', '末次电量 0 后不再来'],
    ['末单结果缺失', D.churn.filter(r => !r.types || String(r.types).indexOf('None') >= 0).length + ' 人', '无结束原因回传'],
  ])}</div>`;
}

/* ---------- mount ---------- */
const main = $('#main'), nav = $('#nav');
const cache = {};
function cfgsOf(v){ if(!cache[v.id]) cache[v.id] = v.cfgs(); return cache[v.id]; }

VIEWS.forEach(v => {
  const b = document.createElement('button');
  b.dataset.id = v.id;
  b.innerHTML = v.label + '<span class="bdg"></span>';
  b.onclick = () => activate(v.id);
  nav.appendChild(b);
  const s = document.createElement('section');
  s.id = 'sec-' + v.id;
  main.appendChild(s);
});

function activate(id){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === 'sec-' + id));
  const v = VIEWS.find(x => x.id === id);
  const sec = $('#sec-' + id);
  if(!sec.dataset.built){
    if(v.kpis) sec.insertAdjacentHTML('beforeend', kpiBlock());
    if(v.cards) sec.insertAdjacentHTML('beforeend', v.cards());
    cfgsOf(v).forEach(cfg => sec.appendChild(buildTable(cfg)));
    sec.dataset.built = '1';
  }
  window.scrollTo({top:0, behavior:'auto'});
}

function kpiBlock(){
  const ov = D.overview, ds = D.devSummary, ps = D.portSummary, us = D.users.summary;
  const fb = ov.fail_breakdown || {};
  return `<div class="kpis">
  ${kpi('设备总数', num(ov.devices), '端口 ' + num(ov.ports))}
  ${kpi('在线运行', num(ds.running_online), '运行中 ' + ds.running_total + ' 台', 'good')}
  ${kpi('离线停运', num(ds.running_offline), '含试充 ' + DEV.filter(d => d.flags.indexOf('TRIAL') >= 0).length + ' 台（1 单即离线）', 'warn')}
  ${kpi('未上电', num(ds.never_powered), '绑定 ' + ds.never_powered_bound + ' / 未绑定 ' + ds.never_powered_unbound)}
  ${kpi('订单总量', num(ov.orders), '成功 ' + num(ov.success))}
  ${kpi('综合成功率', ov.success_rate.toFixed(2) + '%', '失败率 ' + ov.fail_rate.toFixed(2) + '%', ov.success_rate >= 88 ? 'good' : 'warn')}
  ${kpi('总电量', num(ov.kwh), 'kWh，单均 ' + ov.avg_kwh_per_order)}
  ${kpi('总流水', '¥' + num(ov.amount), '单均 ¥' + ov.avg_order_amount)}
  ${kpi('服务用户', num(ov.users), '复充率 ' + us.repeat_rate + '%')}
  ${kpi('无负载失败', num(fb.noload), '失败主因', 'bad')}
  ${kpi('充电掉线', num(fb.charge_drop), '异常中断')}
  ${kpi('有单端口', num(ps.used_ports), '无单 ' + num(ps.unused_ports))}
  </div>
  <div class="card"><h2>阅读说明 · 口径与分层</h2>
  <p class="note">本表为<b>内部数据总表</b>，只做归集与呈现，不重新计算原始结论；各区块均保留原分析底稿的明细字段。三条口径线必须区分：</p>
  <div class="legend" style="display:block;line-height:2">
    <div>① <b>设备状态</b>（在线/离线/未上电/试充/退役）取自设备状态台账，截止 <b>2026-10-15</b>；</div>
    <div>② <b>端口分级与逐口订单指标</b>取自逐口台账 v2，截止 <b>2026-10-24</b>，共 4,480 口、其中 451 口有订单；</div>
    <div>③ <b>站点订单/电量/金额</b>取自站点聚合，截止 <b>2026-10-15</b>，因此站点合计不等于设备合计，属正常口径差异。</div>
  </div>
  <p class="note" style="margin-top:8px">设备状态分布（合计 448 台现网）：在线运行 ${ds.running_online} · 离线停运 ${ds.running_offline}（其中试充子集 ${ds.trial}）· 待绑定 ${ds.pending_bound} · 未绑定 ${ds.unbound} · 未上电 ${ds.never_powered}。另有退役设备 ${ds.decommissioned} 台（${D.decom[0] ? D.decom[0].device_id : ''}，历史 ${num(D.decom[0] ? D.decom[0].orders : 0)} 单）已拆机，不计入 448 台现网清单与 4,480 个端口。</p>
  </div>`;
}

/* ---------- global search ---------- */
let tid = null;
$('#q').addEventListener('input', e => {
  clearTimeout(tid);
  tid = setTimeout(() => {
    Q = e.target.value.trim().toLowerCase();
    updateCounts();
    refreshAllBuilt();
  }, 180);
});
$('#qclear').onclick = () => { $('#q').value = ''; Q = ''; updateCounts(); refreshAllBuilt(); };

function refreshAllBuilt(){
  VIEWS.forEach(v => {
    const sec = $('#sec-' + v.id);
    if(!sec || !sec.dataset.built) return;
    cfgsOf(v).forEach(cfg => { cfg._limit = cfg.pageSize || 100000; refresh(cfg); });
  });
}

function rebuild(id){
  const v = VIEWS.find(x => x.id === id);
  const sec = $('#sec-' + id);
  if(!sec || !sec.dataset.built) return;
  cfgsOf(v).forEach(cfg => { if(cfg._limit > (cfg.pageSize || 1e9)) cfg._limit = cfg.pageSize; refresh(cfg); });
}

function updateCounts(){
  VIEWS.forEach(v => {
    const b = document.querySelector(`nav button[data-id="${v.id}"]`);
    const bdg = b.querySelector('.bdg');
    if(!v.cfgs || v.id === 'ov'){ bdg.style.display = 'none'; return; }
    const cfgs = cfgsOf(v).filter(c => c.rows && c.rows.length);
    if(!cfgs.length){ bdg.style.display = 'none'; return; }
    let hit = 0, tot = 0;
    cfgs.forEach(c => {
      tot += c.rows.length;
      let rs = c.rows;
      const f = c.filters && c.filters.length ? (c.filters.find(x => x.key === c._f) || c.filters[0]) : null;
      if(f && f.test) rs = rs.filter(f.test);
      if(Q) rs = rs.filter(r => rowText(r).indexOf(Q) >= 0);
      hit += rs.length;
    });
    bdg.style.display = '';
    bdg.textContent = Q ? `${num(hit)}/${num(tot)}` : num(tot);
    b.classList.toggle('hit', !!Q && hit > 0);
  });
  $('#qhint').textContent = Q ? `正在过滤「${$('#q').value.trim()}」· 清空以恢复全量` : '输入即过滤全部 8 个区块，Tab 徽标显示命中行数';
}

/* ---------- footer ---------- */
$('#foot').innerHTML = `<b>数据来源</b>：reports/ 下 yanji_device_status.json（设备状态台账）· yanji_v2.json（逐口台账）·
yanji_port_failure_ledger.json（端口故障台账）· yanji_fuse_raw.json（设备主档）· yanji_fuse_replace_check.json（保险丝 A/B/C 反推）·
yanji_highpower.json（高功率）· yanji_intermittent_final.json（间歇故障）· yanji_sabotage_suspect.json（破坏嫌疑检验）·
yanji_report_data.json（流失尾部）· yanji_fuse_analysis.json（品牌映射）。<br>
<b>生成时间</b>：2026-10-26 · <b>设备状态口径</b>：2026-10-15 · <b>端口台账口径</b>：2026-10-24 · 内部使用，对外发布前需脱敏用户手机号。`;

/* ---------- boot ---------- */
activate('dev');
updateCounts();
</script>
