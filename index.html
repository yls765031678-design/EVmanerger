<style>

--red:#b1332a;--red-l:#fcede9;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif;
font-size:13.5px;line-height:1.72;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 64px}

header.hero{background:#D9262C;color:#fff;border-radius:11px;padding:26px 30px 22px}
header.hero h1{margin:0 0 5px;font-size:22px;font-weight:600;letter-spacing:.3px}
header.hero .sub{color:rgba(255,255,255,.88);font-size:13px}
header.hero .meta{margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.2);
display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
header.hero .meta div{font-size:11.5px;color:rgba(255,255,255,.72)}
header.hero .meta b{display:block;color:#fff;font-size:14px;font-weight:600;margin-top:2px;
font-variant-numeric:tabular-nums}

section{background:var(--card);border:1px solid var(--line);border-radius:11px;
padding:20px 24px 22px;margin:13px 0}
h2{font-size:16.5px;font-weight:600;margin:0 0 3px;display:flex;align-items:baseline;gap:11px}
h2 .no{font-size:12px;font-weight:600;color:var(--blue);letter-spacing:.6px;
font-variant-numeric:tabular-nums;min-width:20px}
h2+.lead{color:var(--mut);font-size:12.5px;margin:2px 0 16px 31px;line-height:1.65}
h3{font-size:14px;font-weight:600;margin:22px 0 9px;color:var(--ink)}
h3:first-of-type{margin-top:6px}
h3 .n{color:var(--mut);font-weight:600;font-size:12.5px;margin-right:7px;
font-variant-numeric:tabular-nums}
p{margin:9px 0}
p.tight{margin:5px 0}
.dim{color:var(--mut);font-size:12.3px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;
background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 2px}
.kpi{background:var(--card);padding:15px 17px}
.kpi .lb{color:var(--mut);font-size:11.5px;letter-spacing:.2px}
.kpi .vl{font-size:23px;font-weight:600;margin-top:4px;line-height:1.2;
font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.kpi .ex{color:var(--mut);font-size:11.5px;margin-top:4px}
.kpi .vl.g{color:var(--green)}
.kpi .vl.w{color:var(--amber)}
.kpi .vl.r{color:var(--red)}

.stwrap{display:grid;grid-template-columns:1fr 250px;gap:22px;margin:14px 0 4px;
align-items:start}
@media(max-width:820px){.stwrap{grid-template-columns:1fr}}
.stbar{display:flex;height:26px;border-radius:5px;overflow:hidden;gap:2px;background:var(--card)}
.stbar i{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
font-style:normal;font-weight:600;min-width:1px;overflow:hidden}
.staxis{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:5px}
.stlist{font-size:12.3px}
.stlist div{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2)}
.stlist div:last-child{border-bottom:0}
.stlist b{display:inline-block;width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.stlist .nm{flex:1;color:var(--ink2)}
.stlist .ct{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.stlist .pc{font-variant-numeric:tabular-nums;color:var(--mut);width:46px;text-align:right;font-size:11.5px}

table{width:100%;border-collapse:collapse;font-size:12.4px;margin:6px 0 2px;
font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top;
white-space:nowrap}
thead th{background:var(--gray-l);color:var(--ink2);font-weight:600;font-size:11.5px;
white-space:nowrap;border-bottom:1px solid var(--line);padding:6px 8px}
tbody tr:nth-child(even){background:#fbfcfd}
tbody tr:hover{background:var(--blue-l)}
td.r,th.r{text-align:right}
td.num{font-variant-numeric:tabular-nums}
tr.total td{background:var(--gray-l);font-weight:600;border-top:1px solid var(--line)}
.scroll{max-height:700px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scroll table{margin:0}
.scroll thead th{position:sticky;top:0;z-index:2}

.tag{display:inline-block;padding:0 6px;border-radius:3px;font-size:11.3px;line-height:1.75;
white-space:nowrap;font-weight:500}
.t-g{background:var(--green-l);color:var(--green)}
.t-a{background:var(--amber-l);color:var(--amber)}
.t-r{background:var(--red-l);color:var(--red)}
.t-b{background:var(--blue-l);color:var(--blue)}
.t-n{background:var(--gray-l);color:var(--ink2)}

p.note{background:var(--gray-l);border-left:2px solid #c8cfdb;padding:9px 13px;margin:11px 0;

p.note.w{background:var(--amber-l);border-left-color:#d9a545}

p.note.r{background:var(--red-l);border-left-color:#d47a71}

details.lst>summary{display:flex;align-items:center;gap:10px;cursor:pointer;
list-style:none;padding:11px 2px;font-size:14px;font-weight:600;color:var(--ink)}
details.lst>summary::-webkit-details-marker{display:none}
details.lst>summary::before{content:"▸";color:var(--mut);font-size:11px;
transition:transform .15s;flex:0 0 12px}
details.lst[open]>summary::before{transform:rotate(90deg)}
details.lst>summary:hover{color:var(--blue)}
details.lst>summary .no{color:var(--mut);font-weight:600;font-size:12.5px;

.tbar button:hover{border-color:#b9c6e4;color:var(--blue);background:var(--blue-l)}
.tbar button:disabled{opacity:.55;cursor:default}
.tbar .qbox{position:relative;display:flex;align-items:center}
.tbar input{font:inherit;font-size:12px;line-height:1.5;padding:4px 26px 4px 10px;width:270px;

.tbar input:focus{border-color:#b9c6e4;box-shadow:0 0 0 3px var(--blue-l)}
.tbar .qx{position:absolute;right:5px;top:50%;transform:translateY(-50%);

padding:0 3px;line-height:1}
.tbar .qx:hover{color:var(--red);background:none}
.tbar .qhint{color:var(--mut);font-size:11.5px;white-space:nowrap}

.bar{display:inline-block;height:7px;background:var(--line2);border-radius:4px;

.bar i{display:block;height:100%;background:#9db3e0;border-radius:4px}
.barcell{display:block;height:7px;width:100%;min-width:64px;margin:6px 0 0;

.barcell i{display:block;height:100%;background:#9db3e0;border-radius:4px}

.fbtn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.fcnt{margin-left:auto;color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--blue);background:#eef2fa}
th .ar{color:var(--blue);font-size:9px;margin-left:3px}
td.cw{white-space:normal;min-width:80px;max-width:150px;line-height:1.5;word-break:break-all}
.empty{padding:22px;text-align:center;color:var(--mut);font-size:12.4px}

footer{color:var(--mut);font-size:11.8px;text-align:center;margin-top:22px;line-height:1.9}

  details.lst .scroll{max-height:none;overflow:visible;border:0}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const num = v => (!isNum(v) && v !== 0) ? '—' : Number(v).toLocaleString('zh-CN');
const dash = '<span class="dim">—</span>';
let Q = '';

function tag(c, t){ return `<span class="tag t-${c}">${esc(t)}</span>`; }

/* 成功率：高=绿 */
function srTag(v){
  if(!isNum(v)) return dash;
  const c = v >= 88 ? 'g' : (v >= 70 ? 'a' : 'r');
  return tag(c, v.toFixed(1) + '%');
}
/* 失败率：方向相反，低=绿 */
function frTag(v, total){
  if(!isNum(v) || !total) return dash;
  const c = v <= 5 ? 'g' : (v <= 20 ? 'a' : 'r');
  return tag(c, v.toFixed(1) + '%');
}
/* 端口分级 */
const GT = {op:'g', mid:'a', high:'r', fault:'r', none:'n'};
function gTag(g, label){
  return tag(GT[g] || 'n', label || D.gradeLabel[g] || (g === 'none' ? '无订单' : g));
}
/* 设备状态 */
function stTag(s){
  const m = {'在线运行':'g','离线停运':'r','待绑定·未上电':'a','未绑定·未上电':'a',
             '未上电':'n','未分类':'n'};
  return tag(m[s] || 'n', s);
}
/* 设备标记 */
function flagTags(fl){
  if(!fl || !fl.length) return dash;
  const map = {'STOP':['r','长期停用'],'HP':['b','高功率'],'INT':['b','间歇'],
               'SEG':['n','故障段'],'TRIAL':['b','试运行']};
  return fl.map(f => {
    if(f.indexOf('FUSE:') === 0) return tag('a', '丝' + f.slice(5));
    const m = map[f] || ['n', f];
    return tag(m[0], m[1]);
  }).join(' ');
}

/* 行文本缓存：供全局搜索，收起态也能算命中 */
const TXT = new WeakMap();
function rowText(r){
  let t = TXT.get(r);
  if(t !== undefined) return t;
  const a = [];
  for(const k in r){
    const v = r[k];
    if(v === null || v === undefined || typeof v === 'object') continue;
    a.push(v);
  }
  t = a.join(' ').toLowerCase();
  TXT.set(r, t);
  return t;
}

/* ================= 表格引擎 ================= */
const BLOCKS = [];

function makeBlock(cfg){
  const b = Object.assign({
    filters: null, _f: null, sort: null, intro: '', group: null,
  }, cfg);
  if(b.filters && b.filters.length) b._f = b.filters[0].key;
  if(b.sort) b._sort = {k: b.sort.k, d: b.sort.d || 'desc'};
  else b._sort = null;
  BLOCKS.push(b);
  return b;
}

function rowsOf(b, noSort){
  let rs = b.rows;
  const f = b.filters && b.filters.length
    ? (b.filters.find(x => x.key === b._f) || b.filters[0]) : null;
  if(f && f.test) rs = rs.filter(f.test);
  if(Q) rs = rs.filter(r => rowText(r).indexOf(Q) >= 0);
  if(b._sort && !noSort){
    const col = b.cols.find(c => c.k === b._sort.k);
    const dir = b._sort.d === 'desc' ? -1 : 1;
    const numeric = col && (col.t === 'n' || col.t === 'pct');
    rs = rs.slice().sort((x, y) => {
      let p = x[b._sort.k], q = y[b._sort.k];
      if(numeric){
        p = isNum(p) ? p : -Infinity; q = isNum(q) ? q : -Infinity;
        return (p - q) * dir;
      }
      p = (p === null || p === undefined) ? '' : String(p);
      q = (q === null || q === undefined) ? '' : String(q);
      return p.localeCompare(q, 'zh-CN') * dir;
    });
  }
  return rs;
}

function cell(col, r){
  if(col.render) return col.render(r);
  const v = r[col.k];
  if(col.t === 'n') return isNum(v) ? num(v) : (v === 0 ? '0' : dash);
  if(col.t === 'pct') return srTag(v);
  if(col.t === 'money') return isNum(v) ? '¥' + Number(v).toLocaleString('zh-CN',
    {minimumFractionDigits:2, maximumFractionDigits:2}) : dash;
  if(v === null || v === undefined || v === '') return dash;
  return esc(v);
}

function blockHTML(b){
  const cnt = b.rows.length;
  const filt = b.filters && b.filters.length
    ? `<div class="fbar"><span class="fl">筛选</span>${b.filters.map(f =>
        `<button class="fbtn${f.key === b._f ? ' on' : ''}" data-f="${esc(f.key)}">${esc(f.label)}</button>`
      ).join('')}<span class="fcnt" data-fc></span></div>`
    : '';
  let tbl = '';
  if(b.cols && b.cols.length){
    const th = b.cols.map(c => {
      const cls = [c.t === 'n' || c.t === 'pct' || c.t === 'money' ? 'r' : '', 's']
        .filter(Boolean).join(' ');
      const ar = b._sort && b._sort.k === c.k
        ? `<span class="ar">${b._sort.d === 'desc' ? '▼' : '▲'}</span>` : '';
      return `<th class="${cls}" data-k="${esc(c.k)}">${esc(c.label)}${ar}</th>`;
    }).join('');
    tbl = `<div class="scroll"><table><thead><tr>${th}</tr></thead>` +
          `<tbody data-tb></tbody></table></div>`;
  }
  return `<details class="lst">
<summary><span class="no">${esc(b.no || '')}</span><span class="ti">${esc(b.title)}</span>
<span class="mt">${esc(b.meta || ('共 ' + num(cnt) + ' 行'))}</span></summary>
<div class="body">${b.intro}${filt}${tbl}
</div></details>`;
}

/* 首次展开才填充 tbody */
function renderBody(b, det){
  const tb = det.querySelector('[data-tb]');
  if(!tb || det.dataset.done === '1') return;  const rs = rowsOf(b);
  const out = [];
  for(let i = 0; i < rs.length; i++){
    const r = rs[i];
    let tr = '<tr>';
    for(let j = 0; j < b.cols.length; j++){
      const c = b.cols[j];
      const cls = (c.t === 'n' || c.t === 'pct' || c.t === 'money') ? ' class="r"'
        : (c.wrap ? ' class="cw"' : '');
      tr += `<td${cls}>${cell(c, r)}</td>`;
    }
    out.push(tr + '</tr>');
  }
  tb.innerHTML = out.length ? out.join('')
    : `<tr><td colspan="${b.cols.length}"><div class="empty">无匹配记录</div></td></tr>`;
  det.dataset.done = '1';
  const fc = det.querySelector('[data-fc]');
  if(fc) fc.textContent = rs.length === b.rows.length
    ? `共 ${num(b.rows.length)} 行` : `筛选后 ${num(rs.length)} 行 / 全量 ${num(b.rows.length)} 行`;
}

/* 强制重绘（排序/筛选/搜索变更时） */
function repaint(b, det){
  det.dataset.done = '0';
  if(det.open) renderBody(b, det);
  const mt = det.querySelector('.mt');
  if(mt){
    const hit = rowsOf(b).length;
    mt.textContent = (hit === b.rows.length)
      ? (b.meta || ('共 ' + num(b.rows.length) + ' 行'))
      : (Q ? `命中 ${num(hit)} / 共 ${num(b.rows.length)}` : `共 ${num(hit)} 行`);
  }
}

/* ================= 章节构建 ================= */
const MAIN = document.getElementById('main');

function section(no, title, lead, inner){
  const el = document.createElement('section');
  el.innerHTML = `<h2><span class="no">${no}</span>${esc(title)}</h2>`
    + (lead ? `<p class="lead">${lead}</p>` : '') + inner;
  MAIN.appendChild(el);
  return el;
}

function kpiGrid(items){
  return `<div class="kpis">${items.map(x =>
    `<div class="kpi"><div class="lb">${x[0]}</div><div class="vl ${x[3]||''}">${x[1]}</div>`
    + `<div class="ex">${x[2]}</div></div>`).join('')}</div>`;
}
function kvGrid(items){
  return `<div class="kv">${items.map(x => `<div>${x[0]}<b>${x[1]}</b></div>`).join('')}</div>`;
}
function blockEl(parent, cfg){
  const b = makeBlock(cfg);
  const wrap = document.createElement('div');
  wrap.innerHTML = blockHTML(b);
  const det = wrap.firstElementChild;
  b._det = det;
  det.addEventListener('toggle', () => { if(det.open) renderBody(b, det); });
  det.querySelectorAll('.fbtn').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.preventDefault(); ev.stopPropagation();
      b._f = btn.dataset.f;
      det.querySelectorAll('.fbtn').forEach(x => x.classList.toggle('on', x === btn));
      repaint(b, det);
    });
  });
  det.querySelectorAll('th[data-k]').forEach(th => {
    th.addEventListener('click', ev => {
      ev.preventDefault(); ev.stopPropagation();
      const k = th.dataset.k;
      b._sort = (b._sort && b._sort.k === k)
        ? {k, d: b._sort.d === 'desc' ? 'asc' : 'desc'} : {k, d: 'desc'};
      det.querySelectorAll('th[data-k]').forEach(x => {
        const c = b.cols.find(y => y.k === x.dataset.k);
        x.innerHTML = esc(c.label);
        if(b._sort.k === x.dataset.k){
          x.insertAdjacentHTML('beforeend',
            `<span class="ar">${b._sort.d === 'desc' ? '▼' : '▲'}</span>`);
        }
      });
      repaint(b, det);
    });
  });
  parent.appendChild(wrap);
  return det;
}

/* 流失末单结果标签 */
function typeTags(t){
  if(t === null || t === undefined) return dash;
  const s = String(t).trim();
  if(!s || s === 'None') return dash;
  const out = [];
  if(s.indexOf('充电失败') >= 0) out.push(tag('r','充电失败'));
  if(s.indexOf('功率超标') >= 0) out.push(tag('a','功率超标'));
  if(s.indexOf('电量充满') >= 0) out.push(tag('g','充满'));
  if(s.indexOf('用户主动停止') >= 0) out.push(tag('n','主动停止'));
  return out.length ? out.join(' ') : esc(s);
}

/* ================= 交互：全展全收 + 搜索 ================= */
const listn = document.getElementById('lstn');
const qhint = document.getElementById('qhint');
const dets = () => Array.prototype.slice.call(document.querySelectorAll('details.lst'));
listn.textContent = dets().length;

document.querySelector('.tbar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b || !b.dataset.act) return;
  const open = b.dataset.act === 'exp';
  const btn = b;
  const old = btn.textContent;
  if(open){
    btn.disabled = true; btn.textContent = '展开中…';
    setTimeout(() => {
      dets().forEach(d => { d.open = true; });
      btn.disabled = false; btn.textContent = old;
    }, 16);
  } else {
    dets().forEach(d => { d.open = false; });
  }
});

let tid = null;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(tid);
  const v = e.target.value.trim();
  tid = setTimeout(() => applyQuery(v), 200);
});
document.getElementById('qx').addEventListener('click', () => {
  document.getElementById('q').value = '';
  applyQuery('');
});

function applyQuery(v){
  Q = v.toLowerCase();
  qhint.textContent = Q ? '过滤中：' + v : '';
  let hitTotal = 0;
  BLOCKS.forEach(b => {
    const det = b._det;
    if(!det) return;
    const n = Q ? rowsOf(b).length : b.rows.length;
    hitTotal += n;
    const mt = det.querySelector('.mt');
    if(mt){
      mt.textContent = Q
        ? `命中 ${num(n)} / 共 ${num(b.rows.length)}`
        : (b.meta || ('共 ' + num(b.rows.length) + ' 行'));
    }
    if(Q){
      // 有命中就展开并重绘，无命中收起
      if(n > 0){
        if(!det.open) det.open = true;
        det.dataset.done = '0';
        renderBody(b, det);
      } else {
        det.open = false;
        det.dataset.done = '0';
      }
    } else {
      det.dataset.done = '0';
      if(det.open) renderBody(b, det);
      const fc = det.querySelector('[data-fc]');
      if(fc) fc.textContent = '';
    }
  });
  if(Q) qhint.textContent = `过滤中：${v} · 命中 ${num(hitTotal)} 行`;
}
